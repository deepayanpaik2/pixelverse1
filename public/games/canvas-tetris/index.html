<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Canvas Tetris Deluxe — Pixelverse Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090a10;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .wrapper {
      display: flex;
      gap: 16px;
      align-items: flex-start;
      background: #111424;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid #232a48;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
    }
    canvas#tetris {
      background: #08090f;
      border: 2px solid #1e243d;
      border-radius: 6px;
      display: block;
    }
    .side-panel {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 110px;
    }
    .stat-box {
      background: #161a2e;
      border: 1px solid #262e4e;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
    }
    .stat-title {
      font-size: 10px;
      text-transform: uppercase;
      color: #7280a5;
      font-weight: 700;
    }
    .stat-val {
      font-size: 18px;
      font-weight: 800;
      color: #00f0ff;
    }
    canvas#next-piece {
      background: #0b0d18;
      border-radius: 6px;
      margin-top: 4px;
    }
    .btn {
      background: #00f0ff;
      color: #000;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-weight: 800;
      cursor: pointer;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn:hover { background: #39ff14; box-shadow: 0 0 12px #39ff14; }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #556282;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <canvas id="tetris" width="220" height="440"></canvas>
    <div class="side-panel">
      <div class="stat-box">
        <div class="stat-title">Score</div>
        <div class="stat-val" id="score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Lines</div>
        <div class="stat-val" id="lines">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-title">Next</div>
        <canvas id="next-piece" width="90" height="90"></canvas>
      </div>
      <button class="btn" onclick="initGame()">RESET</button>
    </div>
  </div>
  <div class="hint">Arrows: <b>Move & Rotate</b> | Space: <b>Hard Drop</b></div>

  <script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-piece');
    const nextCtx = nextCanvas.getContext('2d');

    const COLS = 10;
    const ROWS = 20;
    const BLOCK_SIZE = 22;

    const PIECES = [
      { shape: [[1, 1, 1, 1]], color: '#00f0ff' }, // I
      { shape: [[1, 1, 1], [0, 1, 0]], color: '#9d4edd' }, // T
      { shape: [[1, 1], [1, 1]], color: '#ffbe0b' }, // O
      { shape: [[1, 1, 0], [0, 1, 1]], color: '#39ff14' }, // Z
      { shape: [[0, 1, 1], [1, 1, 0]], color: '#ff0055' }, // S
      { shape: [[1, 0, 0], [1, 1, 1]], color: '#3a86ff' }, // J
      { shape: [[0, 0, 1], [1, 1, 1]], color: '#fb5607' }  // L
    ];

    let grid = [];
    let currentPiece = null;
    let nextPiece = null;
    let score = 0;
    let lines = 0;
    let dropInterval = 800;
    let lastTime = 0;
    let dropCounter = 0;
    let isGameOver = false;

    function playTone(freq, dur = 0.08) {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ac.createOscillator();
        const g = ac.createGain();
        osc.frequency.value = freq;
        g.gain.setValueAtTime(0.08, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        osc.connect(g);
        g.connect(ac.destination);
        osc.start();
        osc.stop(ac.currentTime + dur);
      } catch(e) {}
    }

    function createPiece() {
      const p = PIECES[Math.floor(Math.random() * PIECES.length)];
      return {
        shape: p.shape,
        color: p.color,
        x: Math.floor(COLS / 2) - Math.floor(p.shape[0].length / 2),
        y: 0
      };
    }

    function initGame() {
      grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
      score = 0;
      lines = 0;
      isGameOver = false;
      document.getElementById('score').textContent = '0';
      document.getElementById('lines').textContent = '0';
      currentPiece = createPiece();
      nextPiece = createPiece();
      drawNext();
    }

    function collide(grid, piece, offsetX = 0, offsetY = 0) {
      for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
          if (piece.shape[y][x]) {
            const newX = piece.x + x + offsetX;
            const newY = piece.y + y + offsetY;
            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && grid[newY][newX]) return true;
          }
        }
      }
      return false;
    }

    function rotate(piece) {
      const prevShape = piece.shape;
      piece.shape = piece.shape[0].map((_, i) => piece.shape.map(row => row[i]).reverse());
      if (collide(grid, piece)) {
        if (!collide(grid, piece, 1, 0)) piece.x += 1;
        else if (!collide(grid, piece, -1, 0)) piece.x -= 1;
        else piece.shape = prevShape;
      } else {
        playTone(350, 0.05);
      }
    }

    function merge(grid, piece) {
      for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
          if (piece.shape[y][x]) {
            grid[piece.y + y][piece.x + x] = piece.color;
          }
        }
      }
    }

    function clearLines() {
      let cleared = 0;
      for (let y = ROWS - 1; y >= 0; y--) {
        if (grid[y].every(cell => cell !== 0)) {
          grid.splice(y, 1);
          grid.unshift(Array(COLS).fill(0));
          cleared++;
          y++;
        }
      }
      if (cleared > 0) {
        lines += cleared;
        score += [0, 100, 300, 500, 800][cleared] || (cleared * 200);
        document.getElementById('score').textContent = score;
        document.getElementById('lines').textContent = lines;
        playTone(600, 0.2);
        window.parent.postMessage({ type: 'PIXELVERSE_GAME_SCORE', score: score }, '*');
      }
    }

    function drop() {
      if (!collide(grid, currentPiece, 0, 1)) {
        currentPiece.y++;
      } else {
        merge(grid, currentPiece);
        clearLines();
        currentPiece = nextPiece;
        nextPiece = createPiece();
        drawNext();
        if (collide(grid, currentPiece)) {
          isGameOver = true;
          playTone(180, 0.4);
          window.parent.postMessage({ type: 'PIXELVERSE_GAME_OVER', score: score }, '*');
        }
      }
      dropCounter = 0;
    }

    function hardDrop() {
      while (!collide(grid, currentPiece, 0, 1)) {
        currentPiece.y++;
        score += 2;
      }
      drop();
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
      const piece = nextPiece;
      const offsetX = (nextCanvas.width - piece.shape[0].length * 18) / 2;
      const offsetY = (nextCanvas.height - piece.shape.length * 18) / 2;
      for (let y = 0; y < piece.shape.length; y++) {
        for (let x = 0; x < piece.shape[y].length; x++) {
          if (piece.shape[y][x]) {
            nextCtx.fillStyle = piece.color;
            nextCtx.fillRect(offsetX + x * 18, offsetY + y * 18, 17, 17);
          }
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw grid
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (grid[y][x]) {
            ctx.fillStyle = grid[y][x];
            ctx.fillRect(x * BLOCK_SIZE, y * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
          }
        }
      }

      // Draw ghost piece
      if (currentPiece && !isGameOver) {
        let ghostY = currentPiece.y;
        while (!collide(grid, currentPiece, 0, ghostY - currentPiece.y + 1)) {
          ghostY++;
        }
        for (let y = 0; y < currentPiece.shape.length; y++) {
          for (let x = 0; x < currentPiece.shape[y].length; x++) {
            if (currentPiece.shape[y][x]) {
              ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
              ctx.strokeRect((currentPiece.x + x) * BLOCK_SIZE, (ghostY + y) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
            }
          }
        }
      }

      // Draw current piece
      if (currentPiece && !isGameOver) {
        ctx.fillStyle = currentPiece.color;
        for (let y = 0; y < currentPiece.shape.length; y++) {
          for (let x = 0; x < currentPiece.shape[y].length; x++) {
            if (currentPiece.shape[y][x]) {
              ctx.fillRect((currentPiece.x + x) * BLOCK_SIZE, (currentPiece.y + y) * BLOCK_SIZE, BLOCK_SIZE - 1, BLOCK_SIZE - 1);
            }
          }
        }
      }

      if (isGameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#ff0055';
        ctx.font = 'bold 22px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2);
      }
    }

    function update(time = 0) {
      const deltaTime = time - lastTime;
      lastTime = time;
      dropCounter += deltaTime;
      if (dropCounter > dropInterval && !isGameOver) {
        drop();
      }
      draw();
      requestAnimationFrame(update);
    }

    window.addEventListener('keydown', e => {
      if (isGameOver) return;
      if (e.code === 'ArrowLeft') {
        if (!collide(grid, currentPiece, -1, 0)) currentPiece.x--;
      } else if (e.code === 'ArrowRight') {
        if (!collide(grid, currentPiece, 1, 0)) currentPiece.x++;
      } else if (e.code === 'ArrowDown') {
        drop();
      } else if (e.code === 'ArrowUp') {
        rotate(currentPiece);
      } else if (e.code === 'Space') {
        e.preventDefault();
        hardDrop();
      }
    });

    initGame();
    requestAnimationFrame(update);
  </script>
</body>
</html>
