<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cyber Snake Neon — Pixelverse Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #08090f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      position: relative;
      border: 2px solid #232b4a;
      border-radius: 12px;
      padding: 12px;
      background: #0f1222;
      box-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
    }
    .hud {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #8c9ac2;
    }
    .val { color: #39ff14; font-size: 18px; }
    canvas {
      background: #090a12;
      border: 1px solid #1a2038;
      border-radius: 8px;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 12px;
      background: rgba(9, 10, 18, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
    }
    .btn {
      margin-top: 14px;
      background: #39ff14;
      color: #000;
      border: none;
      padding: 8px 20px;
      font-weight: 800;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hud">
      <div>SCORE: <span class="val" id="score">0</span></div>
      <div>BEST: <span class="val" id="best" style="color:#00f0ff">0</span></div>
    </div>
    <canvas id="canvas" width="400" height="400"></canvas>
    <div class="overlay" id="overlay" style="display: none;">
      <h2 style="color: #ff0055; font-size: 28px;">CRASHED!</h2>
      <p style="color: #8c9ac2; margin-top: 6px;">Final Score: <b id="final-score" style="color:#39ff14">0</b></p>
      <button class="btn" onclick="initGame()">PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const finalScoreEl = document.getElementById('final-score');

    const GRID = 20;
    const COUNT = canvas.width / GRID;

    let snake = [];
    let dx = 1, dy = 0;
    let food = { x: 15, y: 15 };
    let score = 0;
    let best = parseInt(localStorage.getItem('pixelverse_snake_best') || '0', 10);
    bestEl.textContent = best;
    let gameLoop = null;

    function playTone(freq, dur = 0.05) {
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const o = ac.createOscillator();
        const g = ac.createGain();
        o.frequency.value = freq;
        g.gain.setValueAtTime(0.08, ac.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
        o.connect(g);
        g.connect(ac.destination);
        o.start();
        o.stop(ac.currentTime + dur);
      } catch (e) {}
    }

    function initGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dx = 1; dy = 0;
      score = 0;
      scoreEl.textContent = '0';
      overlay.style.display = 'none';
      spawnFood();
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * COUNT),
        y: Math.floor(Math.random() * COUNT)
      };
    }

    function update() {
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= COUNT || head.y < 0 || head.y >= COUNT) {
        gameOver();
        return;
      }

      // Self collision
      for (const seg of snake) {
        if (seg.x === head.x && seg.y === head.y) {
          gameOver();
          return;
        }
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreEl.textContent = score;
        playTone(550, 0.08);
        spawnFood();
        window.parent.postMessage({ type: 'PIXELVERSE_GAME_SCORE', score: score }, '*');
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(gameLoop);
      playTone(160, 0.3);
      if (score > best) {
        best = score;
        localStorage.setItem('pixelverse_snake_best', best);
        bestEl.textContent = best;
      }
      finalScoreEl.textContent = score;
      overlay.style.display = 'flex';
      window.parent.postMessage({ type: 'PIXELVERSE_GAME_OVER', score: score }, '*');
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw food
      ctx.fillStyle = '#ff0055';
      ctx.shadowColor = '#ff0055';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Draw snake
      for (let i = 0; i < snake.length; i++) {
        ctx.fillStyle = i === 0 ? '#39ff14' : '#00f0ff';
        ctx.shadowColor = ctx.fillStyle;
        ctx.shadowBlur = 8;
        ctx.fillRect(snake[i].x * GRID + 1, snake[i].y * GRID + 1, GRID - 2, GRID - 2);
      }
    }

    window.addEventListener('keydown', e => {
      if (e.code === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
      else if (e.code === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
      else if (e.code === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
      else if (e.code === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
    });

    initGame();
  </script>
</body>
</html>
